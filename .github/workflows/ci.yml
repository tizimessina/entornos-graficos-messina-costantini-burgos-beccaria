name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  php-lint:
    name: Verificación de sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint recursivo
        run: |
          find src public config -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l
